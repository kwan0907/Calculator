name: Adjust cart footer clearance

on:
  push:
    paths:
      - '.github/workflows/adjust-cart-padding-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weak-network-cart-date
      - name: Patch spacing
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/adjust-cart-padding-v2.yml
          git config user.name "kwan0907"
          git config user.email "63507197+kwan0907@users.noreply.github.com"
          git add index.html .github/workflows/adjust-cart-padding-v2.yml
          git commit -m "Keep cart items clear of dated summary"
          git push origin HEAD:weak-network-cart-date
