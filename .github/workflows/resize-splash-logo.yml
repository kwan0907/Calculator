name: Resize splash logo

on:
  push:
    paths:
      - '.github/workflows/resize-splash-logo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-v1
      - name: Resize splash logo only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('width: 96px;\n  height: 96px;\n  border-radius: 22px;', 'width: 132px;\n  height: 132px;\n  border-radius: 30px;', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/resize-splash-logo.yml
          git config user.name "kwan0907"
          git config user.email "63507197+kwan0907@users.noreply.github.com"
          git add index.html .github/workflows/resize-splash-logo.yml
          git commit -m "Enlarge startup app logo" || exit 0
          git push origin HEAD:offline-v1
