name: Dark mode comfort patch
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: color-dark-test-v1
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          css = base64.b64decode('').decode('utf-8')
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ===== 暗黑模式舒適配色測試：只覆蓋深色模式 ===== */'
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm -f .github/workflows/apply-dark-mode-comfort.yml .github/workflows/apply-dark-mode-comfort-v2.yml
          git config user.name "kwan0907"
          git config user.email "63507197+kwan0907@users.noreply.github.com"
          git add index.html .github/workflows/
          git commit -m "Test comfortable dark mode palette"
          git push origin HEAD:color-dark-test-v1
