name: Refine splash mark
on:
  push:
    branches:
      - color-dark-test-v1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: color-dark-test-v1
      - name: Apply patch
        run: python3 .github/scripts/refine_splash.py
      - name: Commit changes
        run: |
          rm -f .github/workflows/refine-splash-mark.yml .github/scripts/refine_splash.py
          git config user.name "kwan0907"
          git config user.email "63507197+kwan0907@users.noreply.github.com"
          git add index.html .github/workflows/refine-splash-mark.yml .github/scripts/refine_splash.py
          git commit -m "Refine splash screen app mark"
          git push origin HEAD:color-dark-test-v1
