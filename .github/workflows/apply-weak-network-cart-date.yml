name: Apply weak-network launch and cart date

on:
  push:
    paths:
      - '.github/workflows/apply-weak-network-cart-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weak-network-cart-date

      - name: Patch files
        shell: bash
        run: |
          echo '' | base64 -d > sw.js
          echo '' | base64 -d > /tmp/patch_index.py
          python3 /tmp/patch_index.py

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-weak-network-cart-date.yml
          git config user.name "kwan0907"
          git config user.email "63507197+kwan0907@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-weak-network-cart-date.yml
          git commit -m "Improve weak-network launch and show cart date"
          git push origin HEAD:weak-network-cart-date
