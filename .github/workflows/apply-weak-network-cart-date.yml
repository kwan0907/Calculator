name: Apply weak-network launch and cart date

on:
  push:
    paths:
      - '.github/workflows/apply-weak-network-cart-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: weak-network-cart-date

      - name: Patch calculator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Weak-network behavior: cache-first for navigation, background refresh.
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const CACHE_NAME = 'calculator-static-v2-20260903';", "const CACHE_NAME = 'calculator-static-v3-20260903';")

          old_nav = '''async function navigationResponse(request) {
  const cache = await caches.open(CACHE_NAME);
  const fallback = (await cache.match(request)) || (await cache.match('./index.html')) || (await cache.match('./'));

  const networkPromise = fetch(request).then(async (response) => {
    if (response && response.ok) {
      await cache.put(request, response.clone()).catch(() => {});
      await cache.put('./index.html', response.clone()).catch(() => {});
    }
    return response;
  });

  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error('network timeout')), 3000);
  });

  try {
    const response = await Promise.race([networkPromise, timeout]);
    clearTimeout(timer);
    return response;
  } catch (error) {
    clearTimeout(timer);
    if (fallback) return fallback;
    throw error;
  }
}'''

          new_nav = '''async function navigationResponse(request, event) {
  const cache = await caches.open(CACHE_NAME);
  const cached = (await cache.match(request)) || (await cache.match('./index.html')) || (await cache.match('./'));

  const refresh = fetch(request).then(async (response) => {
    if (response && response.ok) {
      await cache.put(request, response.clone()).catch(() => {});
      await cache.put('./index.html', response.clone()).catch(() => {});
    }
    return response;
  }).catch(() => null);

  if (cached) {
    // 有快取就立即開 App，不再因弱網絡等待；同時背景更新下一次啟動用的版本。
    if (event) event.waitUntil(refresh);
    return cached;
  }

  const response = await refresh;
  if (response) return response;
  throw new Error('offline and no cached app shell');
}'''

          if old_nav not in s:
              raise SystemExit('navigationResponse block not found')
          s = s.replace(old_nav, new_nav, 1)
          s = s.replace('navigationResponse(request).catch(async () => {', 'navigationResponse(request, event).catch(async () => {', 1)
          p.write_text(s, encoding='utf-8')

          # 2) Visible date/time in cart screenshot area. No other cart behavior changes.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = '.cart-summary-top-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); font-weight: 700; }'
          css_new = '.cart-summary-date { margin-bottom: 7px; font-size: 0.78rem; color: var(--text-muted); font-weight: 800; text-align: right; }\n' + css_anchor
          if '.cart-summary-date {' not in s:
              if css_anchor not in s:
                  raise SystemExit('cart CSS anchor not found')
              s = s.replace(css_anchor, css_new, 1)

          html_anchor = '  <div id="cart-summary-section" class="cart-summary">\n    <div class="cart-summary-top-row">'
          html_new = '  <div id="cart-summary-section" class="cart-summary">\n    <div class="cart-summary-date">📅 日期：<span id="cart-current-date"></span></div>\n    <div class="cart-summary-top-row">'
          if 'id="cart-current-date"' not in s:
              if html_anchor not in s:
                  raise SystemExit('cart HTML anchor not found')
              s = s.replace(html_anchor, html_new, 1)

          fn_anchor = 'function updateCartView() {'
          fn_new = '''function updateCartDate() {
  const el = document.getElementById('cart-current-date');
  if (!el) return;
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  el.textContent = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

function updateCartView() {'''
          if 'function updateCartDate() {' not in s:
              if fn_anchor not in s:
                  raise SystemExit('updateCartView anchor not found')
              s = s.replace(fn_anchor, fn_new, 1)

          call_anchor = "  document.getElementById('cart-summary-section').style.display = 'block';\n  \n  let totalQty = 0;"
          call_new = "  document.getElementById('cart-summary-section').style.display = 'block';\n  updateCartDate();\n  \n  let totalQty = 0;"
          if '  updateCartDate();\n' not in s:
              if call_anchor not in s:
                  raise SystemExit('cart date call anchor not found')
              s = s.replace(call_anchor, call_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-weak-network-cart-date.yml
          git config user.name "kwan0907"
          git config user.email "63507197+kwan0907@users.noreply.github.com"
          git add index.html sw.js .github/workflows/apply-weak-network-cart-date.yml
          git commit -m "Improve weak-network launch and show cart date"
          git push origin HEAD:weak-network-cart-date
