name: Apply calmer action colors

on:
  push:
    paths:
      - '.github/workflows/apply-color-test-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: color-test-v2

      - name: Patch action colors only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
            'background: var(--primary-color); color: white; border: none;': 'background: #0369a1; color: white; border: none;',
            'background: var(--copy-bg); color: white; border: none;': 'background: #0369a1; color: white; border: none;',
            'background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));\n  color: white; font-weight: 800; box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);': 'background: linear-gradient(135deg, #0284c7, #075985);\n  color: white; font-weight: 800; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.22);',
            'background: rgba(139, 92, 246, 0.95); color: white;': 'background: rgba(109, 40, 217, 0.94); color: white;',
            'background: rgba(109, 40, 217, 1) !important; color: white !important;': 'background: rgba(91, 33, 182, 1) !important; color: white !important;',
            'background: rgba(91, 33, 182, 1) !important; color: white !important; transform: scale(0.98);': 'background: rgba(76, 29, 149, 1) !important; color: white !important; transform: scale(0.98);',
            'background: linear-gradient(135deg, rgba(16,185,129,0.95), rgba(5,150,105,0.95)); box-shadow: 0 4px 10px rgba(16,185,129,0.3);': 'background: linear-gradient(135deg, rgba(5,150,105,0.96), rgba(4,120,87,0.98)); box-shadow: 0 4px 10px rgba(5,150,105,0.2);',
            'background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));\n  color: white; border: none; padding: 10px 16px; border-radius: 12px;': 'background: linear-gradient(135deg, #0284c7, #075985);\n  color: white; border: none; padding: 10px 16px; border-radius: 12px;'
          }

          changed = 0
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed += 1

          if changed < 6:
              raise SystemExit(f'Only {changed} color targets matched')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit test palette and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/apply-color-test-v2.yml
          git config user.name "kwan0907"
          git config user.email "63507197+kwan0907@users.noreply.github.com"
          git add index.html .github/workflows/apply-color-test-v2.yml
          git commit -m "Test calmer high-contrast action colors"
          git push origin HEAD:color-test-v2
