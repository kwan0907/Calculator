name: Smooth app splash

on:
  push:
    paths:
      - '.github/workflows/smooth-splash.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-v1
      - name: Smooth startup splash
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "html, body {\n  overscroll-behavior-y: none;\n}"
          new = "html { background: #f0f9ff; }\nhtml, body {\n  overscroll-behavior-y: none;\n}"
          if old in s and "html { background: #f0f9ff; }" not in s:
              s = s.replace(old, new, 1)

          old_script = """(function () {\n  function hideAppSplash() {\n    var splash = document.getElementById('app-splash');\n    if (!splash || splash.classList.contains('splash-hide')) return;\n    splash.classList.add('splash-hide');\n    setTimeout(function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 280);\n  }\n  window.addEventListener('load', function () { setTimeout(hideAppSplash, 120); }, { once: true });\n  setTimeout(hideAppSplash, 4500);\n})();"""

          new_script = """(function () {\n  var splashShownAt = performance.now();\n  var minimumSplashMs = 800;\n  function hideAppSplash() {\n    var splash = document.getElementById('app-splash');\n    if (!splash || splash.classList.contains('splash-hide')) return;\n    splash.classList.add('splash-hide');\n    setTimeout(function () { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 280);\n  }\n  function hideWhenReady() {\n    var elapsed = performance.now() - splashShownAt;\n    setTimeout(hideAppSplash, Math.max(0, minimumSplashMs - elapsed));\n  }\n  window.addEventListener('load', hideWhenReady, { once: true });\n  setTimeout(hideAppSplash, 4500);\n})();"""

          if old_script in s:
              s = s.replace(old_script, new_script, 1)
          elif "minimumSplashMs = 800" not in s:
              raise SystemExit('splash script marker not found')

          p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/smooth-splash.yml
          git config user.name "kwan0907"
          git config user.email "63507197+kwan0907@users.noreply.github.com"
          git add index.html .github/workflows/smooth-splash.yml
          git commit -m "Smooth startup splash and remove white flash" || exit 0
          git push origin HEAD:offline-v1
