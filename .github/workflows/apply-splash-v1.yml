name: Apply app splash screen

on:
  push:
    paths:
      - '.github/workflows/apply-splash-v1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-v1
      - name: Patch index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = base64.b64decode('').decode()
          splash = base64.b64decode('').decode()
          if '#app-splash {' not in s:
              s = s.replace('</style>\n</head>', css + '\n</style>\n</head>', 1)
          if 'id="app-splash"' not in s:
              s = s.replace('<body>\n', '<body>\n' + splash, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-splash-v1.yml
          git config user.name "kwan0907"
          git config user.email "63507197+kwan0907@users.noreply.github.com"
          git add index.html .github/workflows/apply-splash-v1.yml
          git commit -m "Add app-logo splash during startup" || exit 0
          git push origin HEAD:offline-v1
