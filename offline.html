<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0ea5e9">
  <title>產品計算器V3</title>
  <style>
    html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f0f9ff;color:#0f172a}
    .boot{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
    .card{background:#fff;border:1px solid rgba(14,165,233,.22);border-radius:16px;padding:22px 26px;box-shadow:0 8px 30px rgba(14,165,233,.10)}
    .spinner{width:30px;height:30px;border:3px solid #bae6fd;border-top-color:#0ea5e9;border-radius:50%;margin:0 auto 12px;animation:s .8s linear infinite}
    .small{margin-top:6px;font-size:12px;color:#64748b}
    @keyframes s{to{transform:rotate(360deg)}}
    @media(prefers-color-scheme:dark){html,body{background:#0f172a;color:#e0f2fe}.card{background:#111827;border-color:rgba(56,189,248,.25)}.small{color:#94a3b8}}
  </style>
</head>
<body>
  <div class="boot">
    <div class="card">
      <div class="spinner"></div>
      <div>正在開啟產品計算器…</div>
      <div class="small">首次使用會建立離線備份</div>
    </div>
  </div>
  <script>
    (async function () {
      const go = () => location.replace('./index.html');
      if (!('serviceWorker' in navigator)) { go(); return; }
      try {
        await navigator.serviceWorker.register('./sw.js', { scope: './' });
        await navigator.serviceWorker.ready;
        if (!navigator.serviceWorker.controller) {
          await new Promise((resolve) => {
            let done = false;
            const finish = () => { if (!done) { done = true; resolve(); } };
            navigator.serviceWorker.addEventListener('controllerchange', finish, { once: true });
            setTimeout(finish, 1800);
          });
        }
      } catch (e) {
        console.warn('Offline bootstrap failed:', e);
      }
      go();
    })();
  </script>
</body>
</html>
